spring.application.name=integration-platform

# Base URL the CRM uses to deliver its webhooks back into the integration platform.
integration.platform.webhook.base-url=http://localhost:8080

# ------------------- Database -------------------
# PostgreSQL connection details are supplied by the environment; no credentials
# or environment-specific database address are committed to source control.
spring.datasource.url=${POSTGRES_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}

# Evolve the schema from the JPA entities (dev convenience; use Flyway/Liquibase for production).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
